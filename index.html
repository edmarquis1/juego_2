<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Busca el Gemelo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #ffebee 0%, #fce4ec 50%, #f3e5f5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #e91e63;
            width: 100%;
            max-width: 800px;
        }
        
        .header h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px #f8bbd0;
            background: linear-gradient(135deg, #e91e63, #ad1457);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header p {
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            color: #f06292;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .level-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }
        
        .level-btn {
            padding: 15px 20px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border: none;
            border-radius: 30px;
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 0 #e65100;
            flex: 1;
            min-width: 120px;
            max-width: 170px;
            color: white;
            font-weight: bold;
        }
        
        .level-btn:hover, .level-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #e65100;
        }
        
        .level-btn.active {
            background: linear-gradient(135deg, #e91e63, #ad1457);
            box-shadow: 0 6px 0 #880e4f;
        }
        
        .model-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, #ffffff, #f8bbd0);
            border-radius: 30px;
            box-shadow: 0 12px 25px rgba(233, 30, 99, 0.3);
            margin-bottom: 25px;
            padding: 30px;
            text-align: center;
            border: 6px solid #f8bbd0;
            position: relative;
            overflow: hidden;
        }
        
        .model-container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: sparkle 3s linear infinite;
        }
        
        @keyframes sparkle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .model-title {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            margin-bottom: 25px;
            color: #e91e63;
            background: white;
            padding: 12px 25px;
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 4px 0 #f8bbd0;
            position: relative;
            z-index: 2;
        }
        
        .model-emojis {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 120px;
            position: relative;
            z-index: 2;
        }
        
        .emoji {
            font-size: 3.5rem;
            filter: drop-shadow(3px 3px 2px rgba(0,0,0,0.2));
            animation: float 3s ease-in-out infinite;
            transform-origin: center;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        
        .options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 25px;
        }
        
        .option {
            cursor: grab;
            transition: all 0.3s;
            user-select: none;
            touch-action: none;
            position: relative;
            background: linear-gradient(135deg, #ffffff, #e3f2fd);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 5px solid #ff9800;
            min-width: 200px;
        }
        
        .option:hover {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .option.dragging {
            opacity: 0.9;
            transform: scale(1.12) rotate(0deg);
            z-index: 100;
            border-color: #e91e63;
            box-shadow: 0 20px 40px rgba(233, 30, 99, 0.3);
        }
        
        .option-emojis {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            min-height: 80px;
        }
        
        .option .emoji {
            font-size: 2.5rem;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }
        
        .drop-zone {
            width: 100%;
            max-width: 800px;
            min-height: 180px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
            margin-bottom: 20px;
            padding: 30px;
            text-align: center;
            border: 5px dashed #4caf50;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .drop-zone::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.3) 10px,
                rgba(255,255,255,0.3) 20px
            );
            animation: slide 2s linear infinite;
        }
        
        @keyframes slide {
            0% { transform: translateX(-20px); }
            100% { transform: translateX(0px); }
        }
        
        .drop-zone.highlight {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            border-color: #2e7d32;
            animation: success-pulse 0.5s ease-in-out;
        }
        
        @keyframes success-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .drop-zone-text {
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            color: #2e7d32;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }
        
        .drop-zone-content {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            z-index: 2;
        }
        
        .feedback {
            margin-top: 20px;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            font-weight: bold;
            color: #e91e63;
            text-align: center;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            background: linear-gradient(135deg, #ffffff, #fce4ec);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 6px 0 #f8bbd0;
            transition: all 0.3s;
        }
        
        .success {
            color: #4caf50;
            background: linear-gradient(135deg, #ffffff, #e8f5e9);
            animation: celebrate 0.5s ease-in-out;
        }
        
        .error {
            color: #f44336;
            background: linear-gradient(135deg, #ffffff, #ffebee);
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .reset-btn {
            padding: 18px 35px;
            background: linear-gradient(135deg, #e91e63, #ad1457);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 6px 0 #880e4f;
            width: 100%;
            max-width: 250px;
            font-weight: bold;
        }
        
        .reset-btn:hover, .reset-btn:active {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #880e4f;
        }
        
        /* Instrucciones para móviles */
        .mobile-instructions {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-size: 1rem;
            color: #f06292;
            background: white;
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 0 #f8bbd0;
        }
        
        @media (max-width: 767px) {
            .mobile-instructions {
                display: block;
            }
            
            .options-container {
                gap: 15px;
            }
            
            .option {
                padding: 20px;
                min-width: 160px;
            }
            
            .emoji {
                font-size: 3rem;
            }
            
            .option .emoji {
                font-size: 2rem;
            }
            
            .model-container {
                padding: 20px;
            }
        }
        
        /* Efectos de confeti para celebración */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            opacity: 0;
            animation: confetti-fall 3s ease-in-out forwards;
            z-index: 1000;
            font-size: 1.5rem;
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(1000px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 Busca el Gemelo</h1>
        <p>Encuentra el grupo que tiene la misma cantidad que este</p>
    </div>
    
    <div class="level-selector">
        <button class="level-btn active" data-level="1">Nivel 1 (1-5)</button>
        <button class="level-btn" data-level="2">Nivel 2 (1-10)</button>
        <button class="level-btn" data-level="3">Nivel 3 (1-15)</button>
    </div>
    
    <div class="model-container">
        <div class="model-title">Grupo Modelo</div>
        <div class="model-emojis" id="model-emojis">
            <!-- Los emojis se agregarán aquí con JavaScript -->
        </div>
    </div>
    
    <div class="mobile-instructions">
        👆 Toca y arrastra el grupo correcto
    </div>
    
    <div class="options-container" id="options-container">
        <!-- Las opciones se generarán aquí -->
    </div>
    
    <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-text" id="drop-zone-text">Arrastra aquí el grupo gemelo</div>
        <div class="drop-zone-content" id="drop-zone-content">
            <!-- Aquí aparecerá el grupo arrastrado -->
        </div>
    </div>
    
    <div class="feedback" id="feedback">
        ¡Encuentra el grupo con la misma cantidad!
    </div>
    
    <button class="reset-btn" id="reset-btn">🎉 Jugar de nuevo</button>
    
    <script>
        // Variables del juego
        let currentLevel = 1;
        let targetCount = 0;
        let correctOptionIndex = 0;
        let isMobile = false;
        let draggedElement = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        
        // Elementos DOM
        const modelEmojis = document.getElementById('model-emojis');
        const optionsContainer = document.getElementById('options-container');
        const dropZone = document.getElementById('drop-zone');
        const dropZoneText = document.getElementById('drop-zone-text');
        const dropZoneContent = document.getElementById('drop-zone-content');
        const feedback = document.getElementById('feedback');
        const resetBtn = document.getElementById('reset-btn');
        const levelButtons = document.querySelectorAll('.level-btn');
        
        // Emojis divertidos y coloridos
        const emojiSets = [
            ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯'],
            ['🍎', '🍌', '🍒', '🍓', '🍉', '🍇', '🍑', '🍍', '🥭', '🍊'],
            ['🚗', '🚕', '🚙', '🚌', '🚎', '🏎', '🚓', '🚑', '🚒', '🚐'],
            ['⭐', '🌟', '✨', '💫', '🎈', '🎉', '🎊', '🎁', '🎀', '❤️'],
            ['🌺', '🌸', '💐', '🌷', '🌹', '🥀', '🌻', '🌼', '💮', '🏵️']
        ];
        
        // Detectar si es dispositivo móvil
        function detectMobile() {
            return (('ontouchstart' in window) || 
                    (navigator.maxTouchPoints > 0) || 
                    (navigator.msMaxTouchPoints > 0));
        }
        
        // Inicializar el juego
        function initGame() {
            isMobile = detectMobile();
            
            // Limpiar áreas
            modelEmojis.innerHTML = '';
            optionsContainer.innerHTML = '';
            dropZoneContent.innerHTML = '';
            dropZoneText.style.display = 'block';
            feedback.textContent = '¡Encuentra el grupo con la misma cantidad!';
            feedback.classList.remove('success', 'error');
            dropZone.classList.remove('highlight');
            
            // Determinar cantidad objetivo según nivel
            switch(currentLevel) {
                case 1:
                    targetCount = Math.floor(Math.random() * 5) + 1; // 1-5
                    break;
                case 2:
                    targetCount = Math.floor(Math.random() * 10) + 1; // 1-10
                    break;
                case 3:
                    targetCount = Math.floor(Math.random() * 15) + 1; // 1-15
                    break;
            }
            
            // Determinar cuál opción será la correcta (0, 1 o 2)
            correctOptionIndex = Math.floor(Math.random() * 3);
            
            // Seleccionar un set de emojis aleatorio
            const selectedEmojiSet = emojiSets[Math.floor(Math.random() * emojiSets.length)];
            
            // Crear grupo modelo
            createEmojiGroup(modelEmojis, targetCount, selectedEmojiSet);
            
            // Crear opciones
            for (let i = 0; i < 3; i++) {
                const option = document.createElement('div');
                option.className = 'option';
                option.setAttribute('data-index', i);
                
                const optionEmojis = document.createElement('div');
                optionEmojis.className = 'option-emojis';
                
                // La opción correcta tiene la misma cantidad, las otras tienen cantidades diferentes
                let emojiCount;
                if (i === correctOptionIndex) {
                    emojiCount = targetCount;
                } else {
                    // Generar una cantidad diferente a la objetivo
                    do {
                        emojiCount = Math.floor(Math.random() * (currentLevel * 5)) + 1;
                    } while (emojiCount === targetCount || emojiCount > 15);
                }
                
                createEmojiGroup(optionEmojis, emojiCount, selectedEmojiSet);
                option.appendChild(optionEmojis);
                optionsContainer.appendChild(option);
                
                // Agregar eventos de arrastre
                if (isMobile) {
                    option.addEventListener('touchstart', handleTouchStart);
                } else {
                    option.draggable = true;
                    option.addEventListener('dragstart', handleDragStart);
                    option.addEventListener('dragend', handleDragEnd);
                }
            }
            
            // Configurar zona de destino
            if (isMobile) {
                dropZone.ondragover = null;
                dropZone.ondrop = null;
            } else {
                dropZone.addEventListener('dragover', handleDragOver);
                dropZone.addEventListener('drop', handleDrop);
            }
            
            // Actualizar interfaz
            updateUI();
        }
        
        // Crear un grupo de emojis
        function createEmojiGroup(container, count, emojiSet) {
            for (let i = 0; i < count; i++) {
                const emoji = document.createElement('div');
                emoji.className = 'emoji';
                emoji.textContent = emojiSet[i % emojiSet.length];
                emoji.style.animationDelay = `${i * 0.1}s`;
                container.appendChild(emoji);
            }
        }
        
        // Manejar inicio de arrastre (desktop)
        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.getAttribute('data-index'));
            e.target.classList.add('dragging');
        }
        
        // Manejar fin de arrastre (desktop)
        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }
        
        // Permitir soltar en el área de destino (desktop)
        function handleDragOver(e) {
            e.preventDefault();
        }
        
        // Manejar objeto soltado (desktop)
        function handleDrop(e) {
            e.preventDefault();
            const optionIndex = e.dataTransfer.getData('text/plain');
            checkAnswer(parseInt(optionIndex));
        }
        
        // Manejar inicio de toque (móviles)
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            draggedElement = e.currentTarget;
            
            // Calcular offset
            const rect = draggedElement.getBoundingClientRect();
            dragOffsetX = touch.clientX - rect.left;
            dragOffsetY = touch.clientY - rect.top;
            
            draggedElement.classList.add('dragging');
            draggedElement.style.position = 'fixed';
            draggedElement.style.zIndex = '1000';
            updateElementPosition(touch.clientX, touch.clientY);
            
            document.addEventListener('touchmove', handleTouchMove);
            document.addEventListener('touchend', handleTouchEnd);
        }
        
        // Manejar movimiento de toque (móviles)
        function handleTouchMove(e) {
            if (!draggedElement) return;
            
            e.preventDefault();
            const touch = e.touches[0];
            updateElementPosition(touch.clientX, touch.clientY);
        }
        
        // Manejar fin de toque (móviles)
        function handleTouchEnd(e) {
            if (!draggedElement) return;
            
            e.preventDefault();
            
            // Verificar si se soltó en la zona de destino
            const dropRect = dropZone.getBoundingClientRect();
            const elementRect = draggedElement.getBoundingClientRect();
            
            if (
                elementRect.left < dropRect.right &&
                elementRect.right > dropRect.left &&
                elementRect.top < dropRect.bottom &&
                elementRect.bottom > dropRect.top
            ) {
                const optionIndex = parseInt(draggedElement.getAttribute('data-index'));
                checkAnswer(optionIndex);
            }
            
            // Restaurar elemento arrastrado
            draggedElement.classList.remove('dragging');
            draggedElement.style.position = '';
            draggedElement.style.zIndex = '';
            draggedElement.style.left = '';
            draggedElement.style.top = '';
            
            draggedElement = null;
            
            document.removeEventListener('touchmove', handleTouchMove);
            document.removeEventListener('touchend', handleTouchEnd);
        }
        
        // Actualizar posición del elemento arrastrado (móviles)
        function updateElementPosition(x, y) {
            if (!draggedElement) return;
            
            draggedElement.style.left = (x - dragOffsetX) + 'px';
            draggedElement.style.top = (y - dragOffsetY) + 'px';
        }
        
        // Verificar si la respuesta es correcta
        function checkAnswer(selectedIndex) {
            // Mostrar la opción seleccionada en la zona de destino
            dropZoneText.style.display = 'none';
            dropZoneContent.innerHTML = '';
            const selectedOption = optionsContainer.children[selectedIndex].cloneNode(true);
            selectedOption.classList.remove('dragging');
            selectedOption.style.position = 'static';
            selectedOption.style.transform = 'none';
            dropZoneContent.appendChild(selectedOption);
            
            // Verificar si es correcta
            if (selectedIndex === correctOptionIndex) {
                feedback.textContent = '¡Correcto! 🎉 Has encontrado el gemelo';
                feedback.classList.add('success');
                feedback.classList.remove('error');
                dropZone.classList.add('highlight');
                
                // Efecto de celebración con confeti
                createConfetti();
                
                // Deshabilitar opciones
                for (let option of optionsContainer.children) {
                    if (isMobile) {
                        option.removeEventListener('touchstart', handleTouchStart);
                    } else {
                        option.draggable = false;
                    }
                }
            } else {
                feedback.textContent = '¡No son iguales! Intenta otra vez.';
                feedback.classList.add('error');
                feedback.classList.remove('success');
                
                // Quitar la opción incorrecta después de un tiempo
                setTimeout(() => {
                    dropZoneContent.innerHTML = '';
                    dropZoneText.style.display = 'block';
                }, 1500);
            }
        }
        
        // Crear efecto de confeti
        function createConfetti() {
            const confettiEmojis = ['🎉', '✨', '🌟', '🎊', '💫', '❤️', '🎈', '🥳'];
            
            for (let i = 0; i < 25; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                document.body.appendChild(confetti);
                
                // Eliminar confeti después de la animación
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }
        
        // Actualizar la interfaz de usuario
        function updateUI() {
            // Actualizar botones de nivel
            levelButtons.forEach(btn => {
                if (parseInt(btn.dataset.level) === currentLevel) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        
        // Cambiar nivel
        levelButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                currentLevel = parseInt(btn.dataset.level);
                initGame();
            });
        });
        
        // Reiniciar juego
        resetBtn.addEventListener('click', initGame);
        
        // Inicializar el juego al cargar
        window.addEventListener('DOMContentLoaded', initGame);
        
        // Prevenir el desplazamiento en dispositivos táctiles mientras se arrastra
        document.addEventListener('touchmove', function(e) {
            if (draggedElement) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
